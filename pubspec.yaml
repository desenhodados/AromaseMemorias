name: aromas_memorias
description: Receitas (Tradicional / Airfryer / Bimby) + planeador semanal + lista de compras.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Base de dados local e estado
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.6.1
  
  # Utilitários
  http: ^1.2.1
  path_provider: ^2.1.3
  share_plus: ^10.1.4
  file_picker: ^8.1.6
  image_picker: ^1.1.2
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Ferramentas para ícones e splash screen
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/icon/
    - assets/splash/
